name: YouTube channel digest

on:
  schedule:
    # Cron is UTC. Target delivery: the digest finishes and the GitHub issue
    # (email via notifications@github.com) is created by 07:00 Asia/Jerusalem.
    # GitHub Actions schedules can lag hours, so we schedule early on purpose.
    #
    # 07:00 Asia/Jerusalem = 04:00 UTC on IDT (UTC+3, summer) and 05:00 UTC on
    # IST (UTC+2, winter). Once started, the job finishes in about 4–6 minutes.
    #
    # The previous cron '40 4 * * *' was written as 07:40 Israel, but scheduled
    # runs actually started ~4.5–6.5h later (Sep 22–29: 09:26–11:10 UTC, i.e.
    # 12:26–14:10 IDT). A 00:00 UTC cron would still miss 07:00 IDT under that
    # lag (00:00 + ~5h = 05:00 UTC = 08:00 IDT).
    #
    # 20:15 UTC + a 6.5h lag + ~6 min ≈ 02:51 UTC ≈ 05:51 IDT. A ~7.5h lag
    # still finishes around 06:51 IDT (winter IST is an hour earlier, so the
    # same UTC instant has more room). If the recent lag
    # holds, expect a start around 03:45–05:45 IDT (00:45–02:45 UTC). With no
    # lag the nominal fire time is 23:15 IDT / 22:15 IST the previous evening.
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Never let a manual dispatch race the scheduled run on state.json.
concurrency:
  group: youtube-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet youtube-transcript-api

      - name: Install Claude Code CLI (subscription auth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      # ONE day key for the whole job, Asia/Jerusalem (PROV-YTDATE-01, ruled
      # 2026-10-09): archive file, audio file, issue title and the digest's own
      # `day` all read DIGEST_DAY, so a run crossing midnight between steps
      # cannot split across two dates. Two runs on one UTC date (10-06) used to
      # cp-clobber each other's archive and audio.
      - name: Pick digest day (Asia/Jerusalem)
        run: |
          echo "DIGEST_DAY=$(python scripts/digest_day.py day)" >> "$GITHUB_ENV"
          echo "digest day = $(python scripts/digest_day.py day) (Asia/Jerusalem; UTC now $(date -u +%FT%TZ))"

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
        run: python scripts/youtube_digest.py

      - name: Narrate digest (best effort)
        run: |
          if [ -f digest.md ] && [ "$(cat digest.md)" != "NO_VIDEOS" ]; then
            pip install --quiet edge-tts
            python scripts/make_audio.py --input digest.md --kind youtube \
              --date "$DIGEST_DAY" --append-if-exists \
              || echo "narration failed (non-fatal — text digest unaffected)"
          fi

      - name: Deliver digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY="$DIGEST_DAY"
          HAS_DIGEST=0
          if [ "$(cat digest.md)" != "NO_VIDEOS" ]; then
            HAS_DIGEST=1
            # never cp-clobber: a second run on the same day APPENDS (loudly)
            python scripts/digest_day.py archive digest.md "summaries/youtube/$DAY.md"
          fi

          # 1) Persist state FIRST, with retries. The de-dup state (seen +
          #    pending backlog) must be durably pushed before the issue is
          #    created — otherwise a failed push would re-summarize the same
          #    videos next run and post a duplicate digest (and re-bill Claude).
          git config user.name "halftime-bot"
          git config user.email "actions@github.com"
          git add summaries/youtube/state.json || true
          if [ "$HAS_DIGEST" = "1" ]; then
            git add "summaries/youtube/$DAY.md"
          fi
          git add transcripts/youtube/ 2>/dev/null || true
          git add audio/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "YouTube digest $DAY"
            n=0
            until git push origin "HEAD:${GITHUB_REF_NAME}"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "state push failed after $n attempts — failing the job so state stays consistent"
                exit 1
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
              sleep $((n * 3))
            done
          else
            echo "No state changes to commit."
          fi

          # 2) Only now create the issue — or, if this day already has one,
          #    COMMENT on it (ruled 2026-10-09) so a later run's videos still
          #    reach email. Idempotent: the issue body and every comment carry
          #    <!-- digest-run: RUN_ID -->, and a re-run (same RUN_ID) that
          #    finds its own marker posts nothing.
          if [ "$HAS_DIGEST" = "1" ]; then
            MARKER="<!-- digest-run: $GITHUB_RUN_ID -->"
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
                 --search "YouTube digest — $DAY in:title" \
                 --json number,title --jq ".[] | select(.title == \"YouTube digest — $DAY\") | .number" | head -1)
            if [ -n "$EXISTING" ]; then
              # capture first: `gh … | grep -q` under pipefail can SIGPIPE gh and
              # read a FOUND marker as not-found (→ a duplicate comment)
              POSTED=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body,comments \
                   --jq '.body, .comments[].body')
              if grep -qF "$MARKER" <<<"$POSTED"; then
                echo "Run $GITHUB_RUN_ID already posted to issue #$EXISTING — nothing to do (idempotent re-run)."
              else
                python scripts/digest_day.py body digest.md "$DAY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" --later > digest_comment.md
                gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file digest_comment.md
                # still LOUD: a second run on one day is worth seeing in the Actions list
                MSG="DIGEST ISSUE DEDUPED — day $DAY (Asia/Jerusalem) already has issue #$EXISTING; this run (UTC $(date -u +%FT%TZ), run $GITHUB_RUN_ID) was appended to summaries/youtube/$DAY.md and posted as a COMMENT on #$EXISTING (emailed)."
                echo "::warning::$MSG"
                echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              python scripts/digest_day.py body digest.md "$DAY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > digest_body.md
              gh issue create \
                --title "YouTube digest — $DAY" \
                --body-file digest_body.md \
                --repo "$GITHUB_REPOSITORY"
            fi
          else
            echo "No new videos — no issue to create."
          fi
